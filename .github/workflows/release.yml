# Release build + core selftest on every push to main, on a version tag (v*) and by hand (Actions > release > Run
# workflow). The zip is kept as a build artifact; only a version tag attaches it to a GitHub release of the tag.
# The core selftest (armaview-cli selftest: parsers, configs, CfgMoves, glTF, unit, settings, fuzzing on files it writes
# itself) needs no window and no Arma 3 data.
name: release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      ARMAVIEW_LOCAL_INI: none
    steps:
      - uses: actions/checkout@v4

      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json') }}

      - name: Configure (preset ci)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset ci

      - name: Build Release (ArmaView + armaview-cli)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --build --preset ci

      - name: Core selftest (armaview-cli, no window, no game data)
        shell: pwsh
        run: |
          & "build/ci/Release/armaview-cli.exe" selftest --fuzz 150
          if ($LASTEXITCODE -ne 0) { Write-Error "armaview-cli selftest failed (exit $LASTEXITCODE)"; exit 1 }

      - name: Package
        shell: pwsh
        run: |
          # every file is required: a missing one fails the job instead of shipping an incomplete zip
          $stage = "package"
          New-Item -ItemType Directory -Force "$stage/tools/blender" | Out-Null
          Copy-Item -ErrorAction Stop -Destination $stage -Path @("build/ci/Release/ArmaView.exe", "build/ci/Release/armaview-cli.exe",
            "README.md", "README.ru.md", "LICENSE", "THIRD_PARTY_LICENSES", "armaview.local.ini.example")
          Copy-Item -ErrorAction Stop -Destination "$stage/tools/blender" -Path "tools/blender/armaview_preview.py"
          $name = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "build-$("${{ github.sha }}".Substring(0, 7))" }
          Compress-Archive -Path "$stage/*" -DestinationPath "ArmaView-$name-win64.zip"
          "ZIP_NAME=ArmaView-$name-win64" >> $env:GITHUB_ENV

      - name: Upload the zip (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: package/*
          if-no-files-found: error

      - name: Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ArmaView-${{ github.ref_name }}-win64.zip
